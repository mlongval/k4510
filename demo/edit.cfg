# EDIT's .prg: PROG's layout (demo/prog.cfg) and one more -- a K4SG program
# (the header is demo/edit-header.s): the image from $2000, the code that
# does not fit there at $E000 (HICODE: the files, the keyword pass, the
# help) and at $1A00 (LOCODE: BBC BASIC's keywords), VI's keys as two
# overlays (VIO1, VIO2: demo/dosvi.h), the variables at $0800-$19FF.  EDIT is VI's engine (demo/ed.h) and a front end on
# top; with BBC BASIC's keywords (2026-10-02) it no longer fitted
# $2000-$CFFF with room for the C stack.  BSS at $0800 (where the ROM can
# read it during a system call -- rom_shell's line lives there; $A000-$CFFF
# is the ROM's during a call), the C stack down from $D000: PRG stops
# $0300 short of it (2026-10-07; $0400 before), so an image that would run into the stack does not
# link (until then one could, and the stack wrote over its end).
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0400;
    __STACKTOP__:  type = weak, value = $D000;   # the C stack grows down from here (demo/prg0.s): above the image, $CC00-$CFFF (2026-10-07)
}
MEMORY {
    ZP:   file = "", define = yes, start = $0040, size = $0024;
    LOW:  file = "",               start = $0800, size = $1200;   # BSS, to $19FF
    JUNK: file = "",               start = $1FFC, size = $0004;   # prg0.s's 4-byte header goes nowhere
    HDR:  file = %O,               start = $0000, size = $0100;
    PRG:  file = %O, define = yes, start = $2000, size = $AD00;   # to $CD00: the stack has $CD00-$CFFF (768 bytes, as PROG; 2026-10-07)
    HI:   file = %O, define = yes, start = $E000, size = $1F00;   # the RAM under the ROM, to the stub page
    LO:   file = %O, define = yes, start = $1A00, size = $05FC;   # under the image, above BSS, to the junk header
    VIO1: file = %O, define = yes, start = $E000, size = $1F00;   # VI's keys, two overlays for $E000 (demo/dosvi.h),
    VIO2: file = %O, define = yes, start = $E000, size = $1F00;   # loaded into far memory and banked in by the gate
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    HEADER:   load = JUNK, type = ro;
    SEGHDR:   load = HDR, type = ro;
    STARTUP:  load = PRG, type = ro;
    ONCE:     load = PRG, type = ro, optional = yes;
    CODE:     load = PRG, type = ro;
    RODATA:   load = PRG, type = ro;
    DATA:     load = PRG, type = rw;
    HICODE:   load = HI,  type = ro;
    LOCODE:   load = LO,  type = ro;
    VIO1:     load = VIO1, type = ro;
    VIO2:     load = VIO2, type = ro;
    BSS:      load = LOW, type = bss, define = yes;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
}
