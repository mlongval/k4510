# CALC's .prg: EDIT's layout (demo/edit.cfg) -- a K4SG program (the header is
# demo/calc-header.s): the variables at $0800-$1FFB, the image from $2000,
# and the code that does not fit there at $E000 (HICODE: the files, the CSV,
# the help, the small dialogs, the fills), the RAM under the ROM that a
# program owns while it runs, and at $1A00 (LOCODE: the dates), under the image.  CALC grew past $0800-$CBFF when it put on
# EDIT's clothes and Excel's spelling (2026-10-10).  Undo and the lookups
# are an overlay (CALO, 2026-10-10), linked for $E000 as EDIT's VIO1/VIO2
# are and loaded into far memory at $0E000000, where the far-call gate
# banks it in: CALOTAB, the gate's table, is its first bytes.  The C stack grows down
# from $D000: PRG stops $0300 short of it.
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0400;
    __STACKTOP__:  type = weak, value = $D000;
}
MEMORY {
    ZP:   file = "", define = yes, start = $0040, size = $0024;
    LOW:  file = "",               start = $0800, size = $1200;   # BSS, to $19FF
    JUNK: file = "",               start = $1FFC, size = $0004;   # prg0.s's 4-byte header goes nowhere
    HDR:  file = %O,               start = $0000, size = $0100;
    PRG:  file = %O, define = yes, start = $2000, size = $AD00;   # to $CD00: the stack has $CD00-$CFFF
    HI:   file = %O, define = yes, start = $E000, size = $1F00;   # the RAM under the ROM, to the stub page
    LO:   file = %O, define = yes, start = $1A00, size = $05FC;   # under the image, above BSS, to the junk header
    CALO: file = %O, define = yes, start = $E000, size = $1F00;   # the overlay: undo and the lookups (CALO_P in calc.c)
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    HEADER:   load = JUNK, type = ro;
    SEGHDR:   load = HDR, type = ro;
    STARTUP:  load = PRG, type = ro;
    ONCE:     load = PRG, type = ro, optional = yes;
    CODE:     load = PRG, type = ro;
    RODATA:   load = PRG, type = ro;
    DATA:     load = PRG, type = rw;
    HICODE:   load = HI,  type = ro;
    LOCODE:   load = LO,  type = ro;
    CALOTAB:  load = CALO, type = ro;
    CALO:     load = CALO, type = ro;
    CALOB:    load = CALO, type = rw;    # the overlay's variables, in it (written to the file as zeros)
    BSS:      load = LOW, type = bss, define = yes;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
}
