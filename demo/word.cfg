# WORD's .prg: loaded at $2000, variables at $0800 -- EDIT's layout (demo/edit.cfg),
# plus BIGBSS after the image for the buffers only DMA touches (a paragraph
# being built, a line being drawn, the style table): too big for $0800-$1FFC,
# and never handed to the ROM, so they may sit anywhere below $D000.
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0400;
}
MEMORY {
    ZP:   file = "", define = yes, start = $0040, size = $0024;
    LOW:  file = "",               start = $0800, size = $17FC;   # to the header at $1FFC
    HDR:  file = %O,               start = $1FFC, size = $0004;
    PRG:  file = %O, define = yes, start = $2000, size = $AC00;   # to $CC00: the C stack has $CC00-$CFFF
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    HEADER:   load = HDR, type = ro;
    STARTUP:  load = PRG, type = ro;
    ONCE:     load = PRG, type = ro, optional = yes;
    CODE:     load = PRG, type = ro;
    RODATA:   load = PRG, type = ro;
    DATA:     load = PRG, type = rw;
    BIGBSS:   load = PRG, type = bss, define = yes;
    BSS:      load = LOW, type = bss, define = yes;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
}
