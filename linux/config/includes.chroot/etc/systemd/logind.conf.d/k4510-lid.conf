# K4510 Linux: closing the lid must NOT suspend the machine.  Doc, the Dell,
# 2026-09-11: "closing the lid puts the k4510 into suspend".  An appliance that
# lives in RAM and shows a banner should simply keep running (and keep its
# telnet and tube alive) with the lid down; the power button is the off switch.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
