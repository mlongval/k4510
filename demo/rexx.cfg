# K4510 RX (demo/rexx.c): a plain .prg loaded at $0800 -- the interpreter is
# big and its buffers bigger, so it takes the whole program area to $CFFF,
# and the RAM under the ROM ($E000-$FEFF, the program's while it runs; SWAP
# keeps it) for its expression temporaries and its C stack.  Until
# 2026-10-09 the stack grew down from $D000 into the end of BSS -- 1 KB was
# left between them, and the guard allowed 1.5 KB; INTERPRET and immediate
# mode would have left nothing.  Nothing in the HI area goes to the ROM by
# pointer: the storage device reads physical memory, where $E000 is RAM.
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0600;
    __STACKTOP__:  type = weak, value = $FF00;   # the C stack grows down from here (demo/prg0.s), to HIBSS's end
}
MEMORY {
    ZP:   file = "", define = yes, start = $0040, size = $0024;
    HDR:  file = %O,               start = $07FC, size = $0004;
    PRG:  file = %O, define = yes, start = $0800, size = $C800;   # RX: 50 KB, $0800-$CFFF
    HI:   file = "",               start = $E000, size = $1F00;   # the RAM under the ROM: HIBSS, then the C stack
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    HEADER:   load = HDR, type = ro;
    STARTUP:  load = PRG, type = ro;
    ONCE:     load = PRG, type = ro, optional = yes;
    CODE:     load = PRG, type = ro;
    RODATA:   load = PRG, type = ro;
    DATA:     load = PRG, type = rw;
    BSS:      load = PRG, type = bss, define = yes;
    HIBSS:    load = HI,  type = bss, define = yes;   # not zeroed (prg0.s zeroes BSS only): nothing there needs it
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
}
