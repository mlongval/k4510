# VI's .prg: prg.cfg, but with the variables down at $0800.
# The code is loaded at $6000 like every program's, and the C stack starts at
# $D000 and grows down.  VI grew (:renum, :make) until its BSS ended at $CF2C
# -- 212 bytes above the stack's start, which the stack would have walked
# through.  A program owns $0800-$CFFF and VI used none of $0800-$5FFF, so
# the BSS goes there: nothing in the file changes, the stack gets its room.
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0400;
}
MEMORY {
    ZP:   file = "", define = yes, start = $0040, size = $0024;
    LOW:  file = "",               start = $0800, size = $57FC;   # to the header at $5FFC
    HDR:  file = %O,               start = $5FFC, size = $0004;
    PRG:  file = %O, define = yes, start = $6000, size = $7000;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    HEADER:   load = HDR, type = ro;
    STARTUP:  load = PRG, type = ro;
    ONCE:     load = PRG, type = ro, optional = yes;
    CODE:     load = PRG, type = ro;
    RODATA:   load = PRG, type = ro;
    DATA:     load = PRG, type = rw;
    BSS:      load = LOW, type = bss, define = yes;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
}
