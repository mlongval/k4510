# chess: a K4SG program -- the code at $6000, then Tiny Dungeon's tiles and
# map as a second segment the loader puts in far memory. prg0.s's 4-byte
# HEADER goes nowhere.
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0400;
}
MEMORY {
    ZP:   file = "", define = yes, start = $0040, size = $0024;
    JUNK: file = "",               start = $1FFC, size = $0004;
    HDR:  file = %O,               start = $0000, size = $0100;
    PRG:  file = %O, define = yes, start = $2000, size = $B000;
    RAM2: file = "",  define = yes, start = $E000, size = $1F00;   # the RAM above the I/O page: a program owns it too.
                                                                   # The game history lives there since the port went in
                                                                   # (2026-09-07) and BSS stopped fitting under $D000.
    DAT:  file = %O, define = yes, start = $0000, size = $20000;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    HEADER:   load = JUNK, type = ro;
    SEGHDR:   load = HDR,  type = ro;
    STARTUP:  load = PRG,  type = ro;
    ONCE:     load = PRG,  type = ro, optional = yes;
    CODE:     load = PRG,  type = ro;
    RODATA:   load = PRG,  type = ro;
    DATA:     load = PRG,  type = rw;
    BSS:      load = PRG,  type = bss, define = yes;
    BSS2:     load = RAM2, type = bss, define = yes, optional = yes;
    CHESS:     load = DAT,  type = ro;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
}
