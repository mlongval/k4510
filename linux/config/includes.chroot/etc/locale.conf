#  K4510: the image generates no locales, and C.UTF-8 is built into glibc.
#  Without a UTF-8 LANG, bash's readline drops accented characters typed on
#  the Linux consoles (Ctrl+Alt+F2) -- Doc, 2026-09-12.  pam_env reads this
#  through /etc/default/locale, which on Debian 13 is a symlink to it (so the
#  setting lives HERE: a file shipped as etc/default/locale was written
#  through the link at build time and never reached the layer).
LANG=C.UTF-8
