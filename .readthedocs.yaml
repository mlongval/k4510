# Read the Docs: the handbook as a web site.  The pages are generated from
# the LaTeX chapters by doc/guide/mkweb.py and committed, so the build here
# is MkDocs and nothing else.
version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
mkdocs:
  configuration: doc/site/mkdocs.yml
python:
  install:
    - requirements: doc/site/requirements.txt
