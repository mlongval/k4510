# RADIO.CFG -- k4510-radio's settings: music from Navidrome, internet radio
# and podcasts, played on the Linux beside the machine (Alt+2, then
# k4510-radio music | playlists | station | podcast).
#
# Navidrome (any Subsonic server).  Left empty, the Navidrome sidebar's
# /SYSTEM/SIDEBARS/NAVIDROME/OPTIONS.CFG is used.  Use https: the password
# travels with each request, and make the server a user of its own for this.
server   =
user     =
password =

# Stations: a name, a bar, the stream's address (MP3).  "k4510-radio station
# WORDS" searches radio-browser.info and prints the line to keep.
station = Radio Swiss Jazz | http://stream.srg-ssr.ch/m/rsj/mp3_128

# Podcasts: the feed's address, one a line.
podcast = https://feeds.npr.org/510289/podcast.xml
