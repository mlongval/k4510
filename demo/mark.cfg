# MARK: prg.cfg with a larger zero page, for the measured loops in demo/mark-asm.s,
# and loaded at $2000 as VI and PROG are: the picture, the sieve's flags and the
# report are 22 KB of BSS, and from $6000 they ended 580 bytes under a C stack
# that is given 1 KB ($D000 down).
# K4510 program (.prg): 4-byte header (load address, run address), then
# the image, loaded by the ROM at $6000. Own zero page $40-$63 and own C
# stack at the top of user RAM, so the ROM's state survives the program.
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0400;
}
MEMORY {
    ZP:   file = "", define = yes, start = $0040, size = $0080;   # MARK's loops keep their working set here (gfoot's 27 bytes and ours); a program owns the zero page
    HDR:  file = %O,               start = $1FFC, size = $0004;
    PRG:  file = %O, define = yes, start = $2000, size = $B000;   # stage 3: programs own $0800-$CFFF (+ $E000-$FEFF)
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    HEADER:   load = HDR, type = ro;
    STARTUP:  load = PRG, type = ro;
    ONCE:     load = PRG, type = ro, optional = yes;
    CODE:     load = PRG, type = ro;
    RODATA:   load = PRG, type = ro;
    DATA:     load = PRG, type = rw;
    BSS:      load = PRG, type = bss, define = yes;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
}
