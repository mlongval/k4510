# K4510 LOGO (demo/logo.c): a plain .prg at $2000, RX's layout.  Procedure calls
# recurse on the C stack (a Logo TREE goes ten deep, each level several frames),
# so it gets 8 KB of stack; MAXDEPTH in logo.c turns "too deep" into a message.
SYMBOLS {
    __STACKSIZE__: type = weak, value = $2000;
}
MEMORY {
    ZP:   file = "", define = yes, start = $0040, size = $0024;
    HDR:  file = %O,               start = $07FC, size = $0004;
    PRG:  file = %O, define = yes, start = $0800, size = $C800;   # LOGO: 50 KB, the whole of what a program may own
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    HEADER:   load = HDR, type = ro;
    STARTUP:  load = PRG, type = ro;
    ONCE:     load = PRG, type = ro, optional = yes;
    CODE:     load = PRG, type = ro;
    RODATA:   load = PRG, type = ro;
    DATA:     load = PRG, type = rw;
    BSS:      load = PRG, type = bss, define = yes;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
}
