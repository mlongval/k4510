# INVADER2.CFG -- how fast everything in INVADER2 moves.  Whole numbers.
# A line is NAME VALUE; anything that does not start with a capital letter
# is ignored, so these remarks are safe.  Edit it with VI and RUN again.

# the cannon: pixels per key press (A/D or the arrows)
PLAYER 8
# your bullet: pixels per frame, upward
BULLET 10
# their bomb: pixels per frame, downward
BOMB 6
# the march: pixels per step sideways
STEP 4
# frames between steps on wave 1 (60 frames = one second); smaller is faster
MARCH 20
# how many fewer frames between steps each new wave
FASTER 3
# the floor: the march never gets quicker than this many frames a step
FASTEST 3
# chance of a bomb per frame, in thousandths, on wave 1
FIRE 20
# how much that chance grows per wave, in thousandths
FIREWAVE 5
