# K4510 Linux: what closing the lid does is F7 > Host > Lid closed.
#
# Doc, the Dell, 2026-09-11: "closing the lid puts the k4510 into suspend" --
# an appliance that lives in RAM should keep running with the lid down, and
# this file said ignore.  Doc, 2026-09-14: "would be nice to have the option
# to modify the suspend vs not via f7 menu".  So logind's own rule is now to
# suspend, and the emulator holds logind's handle-lid-switch lock while the F7
# row says "keep running" -- the default, so nothing changes until it is
# chosen (sdl/main.c host_lid_apply).  With the emulator quit to a bare
# shell, nobody holds the lock and the lid suspends.  Docked: never.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
