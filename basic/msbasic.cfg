# Microsoft BASIC for 6502 as a K4510 .prg: a 4-byte header (load address,
# run address) at $6FFC, then the image at $7000.  BASIC's own program RAM
# is everything below it, $0800-$6FFF.  The zero page is declared so ca65
# can place msbasic's ZEROPAGE segment; nothing of it reaches the file.
MEMORY {
    ZP:    file = "", start = $0000, size = $0100, type = rw;
    HDR:   file = %O, start = $6FFC, size = $0004;
    IMG:   file = %O, start = $7000, size = $2900, fill = no;
    DUMMY: file = "", start = $0000, size = $00FF;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    PRGHDR:   load = HDR, type = ro;
    HEADER:   load = IMG, type = ro, optional = yes;
    VECTORS:  load = IMG, type = ro, optional = yes;
    KEYWORDS: load = IMG, type = ro;
    ERROR:    load = IMG, type = ro;
    CODE:     load = IMG, type = ro;
    CHRGET:   load = IMG, type = ro;
    INIT:     load = IMG, type = ro;
    EXTRA:    load = IMG, type = ro, optional = yes;
    DUMMY:    load = DUMMY;
}
