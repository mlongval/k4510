# TERMINAL.CFG -- what JIM's second screen runs (the TERMINAL command,
# Alt+2, F12 > Terminal).  Alt+1 is K/OS again; both go on running.
#
# The first line that is not a comment is the command, run by the shell
# of the Linux beneath the machine.  With none, a login shell there.
#
# A tmux on a server, the same session every time -- and so as many
# terminals as you like, on the one screen:
#
#   k4510-connect you@server tmux new -A -s k4510
#
# k4510-connect is mosh when it can be -- what you type shows at once, and
# the session survives the network changing -- and ssh when it cannot (the
# server has no mosh-server, or its UDP ports 60000-61000 are closed).
# ssh -t you@server ... instead is ssh always; pictures (JIM's Kitty
# graphics) need it, mosh does not carry them.
#
# With this in that server's ~/.tmux.conf, the tmux prefix and K come
# back to K/OS from inside it:
#
#   bind K run-shell "printf '\033]4510;kos\007' > #{client_tty}"
#
# (ESC ] 4510 ; kos BEL is JIM's own sequence: any program can send it.)
