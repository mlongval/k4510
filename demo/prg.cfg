# K4510 program (.prg): 4-byte header (load address, run address), then
# the image, loaded by the ROM at $0800 (at $6000 until 2026-10-06: the
# layout dated from when programs had only $6000-$9FFF, and left a C
# program 28 KB of the 50).  The C stack is the top of the range, down from
# $D000.  The header is read, not loaded: HDR's address is only the linker's.
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0400;
    __STACKTOP__:  type = weak, value = $D000;   # the C stack grows down from here (demo/prg0.s)
}
MEMORY {
    ZP:   file = "", define = yes, start = $0040, size = $0024;
    HDR:  file = %O,               start = $07FC, size = $0004;
    PRG:  file = %O, define = yes, start = $0800, size = $C800;   # programs own $0800-$CFFF (+ $E000-$FEFF)
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    HEADER:   load = HDR, type = ro;
    STARTUP:  load = PRG, type = ro;
    ONCE:     load = PRG, type = ro, optional = yes;
    CODE:     load = PRG, type = ro;
    RODATA:   load = PRG, type = ro;
    DATA:     load = PRG, type = rw;
    BSS:      load = PRG, type = bss, define = yes;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
}
