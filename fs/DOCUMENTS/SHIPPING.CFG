# K4510 -- what ships.  Written by tools/mkmanifest.py; the MARKS are yours.
#
#   essential   goes with every shipping image
#   maybe       decided case by case, at the time of shipping
#   nope        left out of an image -- NOT deleted: the source stays
#               in the repo and the tests still run it
#   nuke        jettisoned: tools/nuke.py stops tracking it and adds it to
#               .gitignore, so it is in no image and is never updated again.
#               What is on a disk stays there; git history keeps the rest.
#
# Run tools/mkmanifest.py again after adding anything: it keeps every mark
# below and appends what is new, as `maybe'.  Nothing is ever marked `nope'
# for you -- that is a decision, and decisions are not generated.


[apps]
app:ANSIDEMO           = nuke
app:APPLE              = maybe       # An Apple IIe, on the Tube co-processor
app:BALLS              = nope
