# Navidrome: its options.  This copy is the defaults; edit the one in
# /SYSTEM/SIDEBARS/NAVIDROME/ (F12 -> Video -> Edit options).
#
# It plays while it is the chosen sidebar, and stops when another is.
# Ctrl+Alt+N is the next song; the volume keys are the machine's.

server   =          # https://your-server:4533   (https: the password travels with each request)
user     =          # make the server a user of its own for this machine
password =
play     = random   # random, or the name of one of that user's playlists (RADIO ALBUM etc. override it)
gain     = 150      # percent: the song's own level x this, under the machine's volume; RADIO VOLUME changes it for now
speed    = 1
