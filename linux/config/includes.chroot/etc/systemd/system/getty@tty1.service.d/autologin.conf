# K4510: tty1 logs the machine's user straight in.  The emulator is started
# from /etc/profile.d/k4510.sh, not from here, so that QUITTING it leaves a
# working login shell on this tty instead of a respawn loop.
# Silently: no /etc/issue banner, no "k4510 login: k4510 (automatic login)"
# line -- with the quiet GRUB entry they were the text on the glass before the
# machine appeared (Doc, 2026-09-13, photos).
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin k4510 --skip-login --noissue --nonewline --noclear %I $TERM
