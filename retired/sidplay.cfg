# sidplay: lives at $E000-$FEFF under the ROM (block 7 banked to RAM by the
# K4SG loader). The tune gets $0400-$CFFF. C stack grows down from $FF00.
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0300;
}
MEMORY {
    ZP:   file = "", define = yes, start = $0040, size = $0024;
    HDR:  file = %O,               start = $0000, size = $0100;
    STB:  file = %O,               start = $0250, size = $0020;
    LOW:  file = "", define = yes, start = $02C0, size = $007C;   # zp swap buffers; ends before the cassette buffer ($033C) some tunes use
    PRG:  file = %O, define = yes, start = $E000, size = $1F00;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    SEGHDR:   load = HDR,  type = ro;
    STUB:     load = STB,  type = ro;
    LOWBSS:   load = LOW,  type = bss, define = yes;
    STARTUP:  load = PRG,  type = ro;
    ONCE:     load = PRG,  type = ro, optional = yes;
    CODE:     load = PRG,  type = ro;
    RODATA:   load = PRG,  type = ro;
    DATA:     load = PRG,  type = rw;
    BSS:      load = PRG,  type = bss, define = yes;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
}
