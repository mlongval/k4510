# SKYFIRE.CFG -- the numbers behind Normal; Easy and Hard follow them.
# One NAME VALUE per line.  Frames are 60ths of a second, speeds are in
# quarter pixels a frame.  These are the defaults.
DIVEGAP 150    # frames between divers on wave 1 (10 fewer each wave)
DIVEMIN 50     # never fewer than this
DIVERS 1       # divers at once on wave 1 (one more every third wave, up to 3)
BOMB 7         # how fast a bomb falls
DIVE 6         # how fast a diver comes down
SWAY 2         # frames per pixel of the formation's sway (bigger = slower)
