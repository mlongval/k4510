# VI's .prg: loaded at $2000, variables at $0800 -- PROG's layout.
# VI grew (:renum, :make, then the shared engine's buffer code) until its
# BSS ended at $CF2C, 212 bytes above where the C stack starts ($D000,
# growing down); moving BSS to $0800 bought 2.3 KB, and the engine's
# buffers took most of that back ($CADA, 1.3 KB, 2026-09-14).  A program
# owns $0800-$CFFF and VI is only ever started over the shell or by SWAP,
# so the image goes to $2000 as PROG's does: some 40 KB of room.
# BSS stays below $A000, where the ROM can read it during a system call
# (rom_shell's line lives there; $A000-$CFFF is the ROM's during a call).
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0400;
}
MEMORY {
    ZP:   file = "", define = yes, start = $0040, size = $0024;
    LOW:  file = "",               start = $0800, size = $17FC;   # to the header at $1FFC
    HDR:  file = %O,               start = $1FFC, size = $0004;
    PRG:  file = %O, define = yes, start = $2000, size = $B000;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    HEADER:   load = HDR, type = ro;
    STARTUP:  load = PRG, type = ro;
    ONCE:     load = PRG, type = ro, optional = yes;
    CODE:     load = PRG, type = ro;
    RODATA:   load = PRG, type = ro;
    DATA:     load = PRG, type = rw;
    BSS:      load = LOW, type = bss, define = yes;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
}
