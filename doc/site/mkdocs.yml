# The K4510 handbook as a web site, for Read the Docs.  The pages in docs/
# are generated from the LaTeX chapters by doc/guide/mkweb.py (run by
# make-guide.sh) and committed; edit the chapters, never the pages.
site_name: The K4510 User's and Programmer's Guide
site_description: A fantasy 8/16-bit computer -- 45GS10, VICKY, MELODY, 256 MB.
site_author: Michael Longval
repo_url: https://github.com/mlongval/k4510
edit_uri: ""
docs_dir: docs
theme:
  name: readthedocs
  navigation_depth: 3
  collapse_navigation: true
  sticky_navigation: true
  # what you type is not a programming language highlight.js knows: it
  # guessed, and coloured ".BAS" and "a" in the middle of a DIR line
  highlightjs: false
extra_css:
  - extra.css
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
# nav: generated by mkweb.py -- the order of k4510-guide.tex
nav:
  - Home: index.md
  - "User's Guide":
      - "1. The Machine": 01-machine.md
      - "2. The Shell": 02-shell.md
      - "3. Every Command": 03-commands.md
      - "4. EhBASIC": 04-ehbasic.md
      - "5. Microsoft BASIC, 1977": 05-msbasic.md
      - "6. The Tube: BBC BASIC": 06-tube.md
      - "7. Forth": 07-forth.md
      - "8. LOGO": 08-logo.md
      - "9. CP/M: the Z80 Second Processor": 09-cpm.md
      - "10. Pascal": 10-pascal.md
      - "11. The Editors": 11-editors.md
      - "12. RX: the Machine's REXX": 12-rx.md
      - "13. The Linux Underneath": 13-linux.md
  - "Programmer's Guide":
      - "14. Memory": 20-memory.md
      - "15. The I/O Page": 21-io.md
  - "Appendices":
      - "A. The Registers": a1-registers.md
      - "B. Filing an Issue": a2-issues.md
      - "C. The Sound, and What It Took": a3-sound.md
  - "About the Book":
      - "Disclaimer": z1-disclaimer.md
      - "Thank You": z2-thanks.md
      - "Licences": z3-licences.md
# end nav
